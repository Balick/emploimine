name: Signaler un problème
description: Une offre erronée, une source cassée, un bug sur le site…
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Ce que vous avez constaté et ce que vous attendiez.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page concernée
      placeholder: "https://…/jobs/…"
  - type: textarea
    id: steps
    attributes:
      label: Comment reproduire
      placeholder: "1. Aller sur…  2. Cliquer sur…"
